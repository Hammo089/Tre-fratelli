<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#175a3c"><meta name="description" content="Tre Fratelli — Neapolitan pizza & Lebanese manakish. Customize your order for pickup or delivery in Beirut."><title>Tre Fratelli — Pizza, your way</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="/" aria-label="Tre Fratelli"><img src="assets/logo.png" alt="Tre Fratelli pizzeria"></a><div class="header-actions"><button id="lang" class="quiet">English</button><button id="lastOrder" class="quiet" hidden data-ar="تابع طلبك" data-en="Track order"></button><button id="cartButton" class="cart-btn">🛍 <span id="cartCount">0</span></button></div></header>
<main><section class="hero"><div class="hero-copy"><span class="eyebrow">NAPOLI SOUL. BEIRUT HEART.</span><h1 data-ar="على ذوقك.<br>من قلب الفرن." data-en="Your taste.<br>Our fire."></h1><p data-ar="بيتزا نابولية ومناقيش لبنانية. اختار، أضف، وخلّي الباقي علينا." data-en="Neapolitan pizza. Lebanese manakish. Make it yours — we’ll bring the fire."></p><div class="hero-tags"><span>✦ <b data-ar="عجينة Caputo" data-en="Caputo dough"></b></span><span>↗ <b data-ar="دليفري بيروت" data-en="Beirut delivery"></b></span></div><button class="primary" id="start" data-ar="ركّب بيتزتك ←" data-en="Build your pizza →"></button><p id="storeState" class="status"></p></div><div class="hero-art"><img src="assets/items/pz-pepperoni.jpg" alt="Pepperoni pizza" fetchpriority="high"><div class="round-seal">FATTA CON<br><b>AMORE</b><br>BEIRUT</div></div></section>
<section class="menu-section"><div class="section-title"><div><span class="eyebrow">THE GOOD STUFF</span><h2 data-ar="منيو مليانة حب" data-en="Made with amore"></h2></div><label class="search"><span>⌕</span><input id="search" type="search" aria-label="Search menu" placeholder="ابحث عن صنف"></label></div><div id="cuisineBanner" class="cuisine-banner"></div><nav id="categories" aria-label="Menu categories"></nav><div id="menu" class="menu-grid" aria-live="polite"></div></section>
<footer><img src="assets/logo.png" alt="Tre Fratelli"><p>Napoli soul. Beirut heart.</p><a href="https://wa.me/9613960649">+961 3 960 649</a><a href="admin.html" data-ar="إدارة المطعم" data-en="Restaurant management"></a></footer></main>
<dialog id="builder"><button class="close" data-close="builder" aria-label="Close">×</button><div class="builder-layout"><div class="build-stage"><span class="eyebrow">A LITTLE YOU. A LOT OF AMORE.</span><h2 id="buildTitle"></h2><div class="oven" aria-hidden="true"><span>480°</span></div><div id="pizzaStage" class="pizza-stage"></div><p id="buildHint" data-ar="كل إضافة بتغيّر شكلها… وطعمها." data-en="Every topping makes it a little more you."></p></div><div class="build-controls"><span class="eyebrow" data-ar="اعملها على ذوقك" data-en="MAKE IT YOURS"></span><label><span data-ar="الحجم" data-en="Size"></span><select id="size"></select></label><div id="baseToppings" class="chips"></div><h3 data-ar="إضافات على ذوقك" data-en="A little extra"></h3><div id="toppings" class="topping-grid"></div><label><span data-ar="ملاحظات للصنف" data-en="Item notes"></span><textarea id="itemNotes" maxlength="300" rows="2"></textarea></label><div class="build-bottom"><div class="stepper"><button id="less" aria-label="Decrease quantity">−</button><span id="quantity">1</span><button id="more" aria-label="Increase quantity">+</button></div><strong id="buildPrice"></strong></div><button id="addItem" class="primary full" data-ar="عالفرن… وإلى السلّة" data-en="Fire it up & add to bag"></button></div></div></dialog>
<dialog id="bag"><button class="close" data-close="bag" aria-label="Close">×</button><h2 data-ar="طلبك الحلو" data-en="Your good stuff"></h2><div id="bagItems"></div><div id="bagTotal"></div><form id="checkout"><p id="prepEstimate" class="prep-estimate"></p><div class="segmented"><label><input name="fulfillment" type="radio" value="delivery" checked><span data-ar="دليفري" data-en="Delivery"></span></label><label><input name="fulfillment" type="radio" value="pickup"><span data-ar="استلام" data-en="Pickup"></span></label></div><label><span data-ar="الاسم" data-en="Name"></span><input name="customer_name" required maxlength="100" autocomplete="name"></label><label><span data-ar="رقم الهاتف" data-en="Phone number"></span><input name="phone" required type="tel" autocomplete="tel" placeholder="03 960 649" maxlength="25"></label><label id="addressLabel"><span data-ar="العنوان، المبنى والطابق" data-en="Address, building & floor"></span><textarea name="address" required maxlength="500" autocomplete="street-address"></textarea></label><label><span data-ar="رابط موقع الخريطة (اختياري)" data-en="Map link (optional)"></span><input name="map_url" type="url" maxlength="500" placeholder="https://maps.google.com/…"></label><label><span data-ar="الدفع" data-en="Payment"></span><select name="payment"><option value="cash">Cash / كاش</option><option value="whish">Whish / ويش</option></select></label><label id="proofLabel" hidden><span data-ar="صورة إيصال Whish (اختياري، حتى 2MB)" data-en="Whish receipt (optional, up to 2MB)"></span><input type="file" id="paymentProof" accept="image/jpeg,image/png,image/webp"></label><p id="whishInfo" class="muted" hidden></p><label><span data-ar="ملاحظات للطلب" data-en="Order notes"></span><textarea name="notes" maxlength="500"></textarea></label><div class="checkout-actions"><button name="channel" value="web" class="primary full" data-ar="أرسل الطلب للمطعم" data-en="Place order online"></button><button name="channel" value="whatsapp" class="secondary full" data-ar="اطلب عبر واتساب" data-en="Order on WhatsApp"></button></div><p id="checkoutError" role="alert"></p></form></dialog>
<dialog id="receipt"><button class="close" data-close="receipt" aria-label="Close">×</button><div id="receiptContent"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
