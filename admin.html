<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Tre Fratelli — Restaurant dashboard</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><img src="assets/logo.png" alt="Tre Fratelli"><h2>إدارة المطعم</h2><p class="muted">دخول الموظفين المصرّح لهم فقط.</p><form id="loginForm" class="admin-form"><label><span>Email</span><input type="email" name="email" required autocomplete="username"></label><label><span>Password</span><input type="password" name="password" required minlength="10" autocomplete="current-password"></label><button class="primary full">دخول / Sign in</button><p id="authError" role="alert"></p></form><button id="signup" class="quiet">إنشاء حساب إدارة جديد</button><p class="muted">إنشاء الحساب لا يمنح صلاحيات إدارة تلقائيًا. يجب تأكيد البريد وتفعيل الحساب من المالك.</p><a href="/">← المنيو</a></div>
<div id="dashboard" class="admin-shell" hidden><aside class="sidebar"><img src="assets/logo.png" alt="Tre Fratelli"><p class="sidebar-title">RESTAURANT STUDIO</p><button class="active" data-page="orders">◫ الطلبات / Orders</button><button data-page="ledger">▤ سجل الطلبات / Ledger</button><button data-page="feedback">☆ الآراء والشكاوى</button><button data-page="menu">◉ المنيو / Menu</button><button data-page="extras">✦ الإضافات / Extras</button><button data-page="reports">↗ التقارير / Reports</button><button data-page="offers">✹ العروضات / Offers</button><button data-page="landing">✥ الواجهة / Landing page</button><button data-page="settings">⚙ الإعدادات / Settings</button><button data-page="staff">♙ الموظفون / Staff</button><button data-page="guide">؟ دليل الاستخدام</button><button id="sound">♫ تفعيل التنبيه</button><button id="logout">خروج / Sign out</button></aside><main class="admin-main"><div class="admin-top"><h1 id="pageTitle">الطلبات</h1><a href="/" target="_blank">عرض المنيو ↗</a><button id="refresh" class="secondary">تحديث</button></div><div id="operationsBar" class="operations-bar"></div><p id="adminMessage" role="status"></p><div id="adminContent"></div></main></div>
<dialog id="editor"><button class="close" id="closeEditor" aria-label="Close">×</button><h2 id="editorTitle"></h2><form id="editForm" class="admin-form"></form></dialog><dialog id="ledgerDetail"><button class="close" id="closeLedgerDetail" aria-label="Close">×</button><div id="ledgerDetailBody"></div></dialog><script type="module" src="admin.js"></script></body></html>
